# Builds and deploys all three LabGuard services.
#
#   gcloud builds submit --config deploy/cloudbuild.yaml \
#     --substitutions=_REGION=us-central1,_BUCKET=your-bucket
substitutions:
  _REGION: us-central1
  _REPO: labguard
  _BUCKET: ""
  _TAG: "manual"
  _GEMINI_MODEL: "gemini-3.5-flash"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:${_TAG}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/frontend:${_TAG}"

steps:
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:${_TAG}"
      - ./backend

  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/frontend:${_TAG}"
      - ./frontend

  - id: push-backend
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:${_TAG}"]

  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/frontend:${_TAG}"]

  # The worker runs the same image as the API. It is deployed first so the
  # Pub/Sub push subscription has an endpoint to target.
  - id: deploy-worker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - labguard-worker
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:${_TAG}
      - --region=${_REGION}
      - --service-account=labguard-worker@${PROJECT_ID}.iam.gserviceaccount.com
      - --no-allow-unauthenticated
      - --memory=1Gi
      - --cpu=2
      - --timeout=900
      - --concurrency=4
      - --min-instances=0
      - --max-instances=10
      - --set-env-vars=LABGUARD_MODE=cloud,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_REGION=${_REGION},GCS_BUCKET=${_BUCKET},GEMINI_MODEL=${_GEMINI_MODEL},GOOGLE_GENAI_USE_VERTEXAI=true,ENABLE_CLOUD_LOGGING=true

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - labguard-api
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:${_TAG}
      - --region=${_REGION}
      - --service-account=labguard-api@${PROJECT_ID}.iam.gserviceaccount.com
      - --allow-unauthenticated
      - --memory=1Gi
      - --cpu=2
      - --timeout=300
      - --min-instances=1
      - --max-instances=5
      - --set-env-vars=LABGUARD_MODE=cloud,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_REGION=${_REGION},GCS_BUCKET=${_BUCKET},GEMINI_MODEL=${_GEMINI_MODEL},GOOGLE_GENAI_USE_VERTEXAI=true,ENABLE_CLOUD_LOGGING=true

  - id: deploy-dashboard
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        API_URL=$(gcloud run services describe labguard-api \
          --region=${_REGION} --format='value(status.url)')
        gcloud run deploy labguard-dashboard \
          --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/frontend:${_TAG} \
          --region=${_REGION} \
          --allow-unauthenticated \
          --memory=512Mi \
          --min-instances=1 \
          --max-instances=5 \
          --set-env-vars=LABGUARD_API_URL=$$API_URL
